name: Build Pythia
on:
  push:
  schedule:
    - cron: '0 0 1 * *'  # runs at 00:00 UTC on the 1st of every month
env:
  PYTHON_VERSION: 3.12.8
jobs:
  Build-Binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        arch: [x64, x86]
        exclude:
          - os: ubuntu-22.04
            arch: x86

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      # Install the target Python (with development headers) that the binaries
      # link against. No interpreter is bundled into @Pythia anymore.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

      - name: Install Python development headers (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install ninja (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Create the directory
        run: mkdir "@Pythia"

      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: ${{ matrix.arch }}

      - name: Perform build
        run: uv run tools/build.py build_binaries ${{ env.PYTHON_VERSION }} ${{ matrix.arch }} ${{ runner.os }}

      - uses: actions/upload-artifact@v4
        with:
          name: _Internal_Pythia_Binaries-${{ runner.os }}-${{ matrix.arch }}
          path: |
            @Pythia/*.dll
            @Pythia/*.so
            @Pythia/*.exe
            @Pythia/PythiaTester*
          if-no-files-found: error
          retention-days: 1

  Build-PBO:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Cache tools
        uses: actions/cache@v3
        with:
          path: tools/cache
          key: tools_cache

      # Build PBOs and pack
      - name: Install Mikero's tools
        uses: arma-actions/mikero-tools@bec8b18fc507ee3180cadeaf35249d3f2702b1ff

      - run: uv run tools/build.py build_pbos

      - uses: actions/upload-artifact@v4
        with:
          name: _Internal_Pythia_PBOs
          path: |
            @Pythia/addons
            @Pythia/keys
          if-no-files-found: error
          retention-days: 1

  Test-Binaries:
    needs: Build-Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        arch: [x64, x86]
        exclude:
          - os: ubuntu-22.04
            arch: x86

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      # The tests drive PythiaTester, which embeds and loads the same system
      # Python the binaries were built against.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Create the directory
        run: mkdir "@Pythia"

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: _Internal_Pythia_Binaries-${{ runner.os }}-${{ matrix.arch }}
          path: "@Pythia"

      - name: Set testers permissions
        if: ${{ runner.os == 'Linux' }}
        run: chmod a+x @Pythia/PythiaTester*

      - name: Copy templates
        run: uv run tools/build.py copy_templates ${{ env.PYTHON_VERSION }}

      - name: Run basic tests
        run: uv run tools/build.py run_tests ${{ env.PYTHON_VERSION }} ${{ matrix.arch }} ${{ runner.os }}

  Consolidate:
    needs:
      - Build-Binaries
      - Build-PBO
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          pattern: _Internal_Pythia_Binaries-*
          path: "@Pythia"
          merge-multiple: true

      - name: Download the PBOs
        uses: actions/download-artifact@v4
        with:
          name: _Internal_Pythia_PBOs
          path: "@Pythia"

      - name: Set testers permissions
        run: chmod a+x @Pythia/PythiaTester*

      - name: Copy templates
        run: uv run tools/build.py copy_templates ${{ env.PYTHON_VERSION }}

      - run: uv run tools/build.py safety_checks ${{ env.PYTHON_VERSION }}

      - run: tar -jcf "@Pythia.tbz" "@Pythia"

      - uses: actions/upload-artifact@v4
#        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: Pythia
          path: "@Pythia.tbz"
          if-no-files-found: error
          retention-days: 8
          compression-level: 0
